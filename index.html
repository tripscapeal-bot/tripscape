<!doctype html><html lang="sq"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Trip Scape Admin</title><style>body{font-family:Arial;background:#0b3024;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:30px;border-radius:20px;width:min(380px,85%)}input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box}button{background:#176b4b;color:white;border:0;border-radius:9px}</style><div class="box"><h1>Trip Scape Admin</h1><input id=e type=email placeholder="Email"><input id=p type=password placeholder="Password"><button id=b>Hyr</button><p id=m></p></div><script type="module">import{supabase}from"../assets/js/supabase.js";b.onclick=async()=>{m.textContent="";let{error}=await supabase.auth.signInWithPassword({email:e.value,password:p.value});if(error)m.textContent=error.message;else location.href="dashboard.html"}</script>
