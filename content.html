<!doctype html><html lang="sq"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Trip Scape Content</title><style>body{font-family:Arial;background:#f5f2e9;color:#16372b}.wrap{width:min(1050px,94%);margin:25px auto}.form,.item{background:#fff;padding:18px;border-radius:16px;margin:10px 0}input,textarea,button{padding:10px;margin:5px;box-sizing:border-box}input,textarea{width:calc(100% - 10px)}button{background:#176b4b;color:#fff;border:0;border-radius:8px}.danger{background:#a33}</style><main class=wrap><a href=dashboard.html>← Dashboard</a><h1 id=h></h1><form class=form id=f></form><div id=list></div></main><script type="module">import{supabase,requireStaff}from"../assets/js/supabase.js";await requireStaff();let t=new URLSearchParams(location.search).get("table")||"destinations";let F={destinations:["name","slug","region","description","image_url","latitude","longitude","published"],villages:["name","slug","region","description","image_url","latitude","longitude","published"],businesses:["name","slug","category","description","phone","email","website","address","city","image_url","latitude","longitude","published"],news:["title","slug","excerpt","content","image_url","source_name","source_url","published"],videos:["title","description","youtube_url","thumbnail_url","published"],gallery:["title","image_url","alt_text","published"]}[t]||["name","description","image_url","published"];h.textContent="Menaxho "+t;for(let q of F){f.insertAdjacentHTML("beforeend",q==="published"?`<label><input id="${q}" type=checkbox checked> published</label>`:`<input id="${q}" placeholder="${q}">`)}f.insertAdjacentHTML("beforeend","<button>Shto</button>");async function load(){let{data}=await supabase.from(t).select("*").order("created_at",{ascending:false});list.innerHTML=(data||[]).map(x=>`<div class=item><b>${x.name||x.title||"Pa titull"}</b><button class=d data-id="${x.id}">Fshi</button></div>`).join("")||"Nuk ka të dhëna";document.querySelectorAll(".d").forEach(b=>b.onclick=async()=>{await supabase.from(t).delete().eq("id",b.dataset.id);load()})}f.onsubmit=async e=>{e.preventDefault();let o={};for(let q of F)o[q]=q==="published"?document.getElementById(q).checked:document.getElementById(q).value;let base=o.name||o.title;if(!o.slug&&base)o.slug=base.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");for(let q of["latitude","longitude"])if(o[q])o[q]=Number(o[q]);let{error}=await supabase.from(t).insert(o);if(error)alert(error.message);else{f.reset();published.checked=true;load()}};load()</script>
