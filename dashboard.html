<!doctype html><html lang="sq"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Trip Scape Dashboard</title><style>body{font-family:Arial;background:#f5f2e9;color:#16372b;margin:0}.nav{background:#0b3024;color:#fff;padding:20px}.wrap{width:min(1100px,92%);margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:25px 0}.card{background:#fff;padding:20px;border-radius:18px}.n{font-size:38px;font-weight:800}a,button{display:inline-block;padding:11px 15px;background:#176b4b;color:#fff;border:0;border-radius:999px;text-decoration:none;margin:4px}</style><div class=nav>TRIP SCAPE ALBANIA — ADMIN</div><main class=wrap><h1>Dashboard</h1><p id=u></p><div class=grid id=s></div><div id=l></div></main><script type="module">import{supabase,requireStaff}from"../assets/js/supabase.js";let{user,profile}=await requireStaff();u.textContent=user.email+" · "+profile.role;let ts=["destinations","villages","businesses","news","videos","gallery","reviews","business_requests"];for(let t of ts){let{count}=await supabase.from(t).select("*",{count:"exact",head:true});s.innerHTML+=`<div class=card><b>${t}</b><div class=n>${count??0}</div></div>`}l.innerHTML=ts.slice(0,6).map(t=>`<a href="content.html?table=${t}">${t}</a>`).join("")+`<button id=x>Dil</button>`;x.onclick=async()=>{await supabase.auth.signOut();location.href="index.html"}</script>
